baseURL = "https://go-binfmt.github.io/"
title = "go-binfmt"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design comes from the landing kit, a Hugo module pinned in go.mod (Renovate
# bumps it); kit.go keeps `go mod tidy` from deleting that requirement. The rules
# only this page uses are in layouts/partials/site-styles.html.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# One card per repository. The blurb says what the module is FOR, never a count
# copied from somewhere else: a number typed here can only go stale.
[[params.repos]]
  name = "elfpatch"
  pkg = "github.com/go-binfmt/elfpatch"
  url = "https://github.com/go-binfmt/elfpatch"
  status = "ready"
  blurb = "A pure-Go replacement for the subset of **NixOS patchelf** that package builders use, with patchelf's own flag names: read and edit an ELF file's **interpreter**, **RUNPATH/RPATH** and **DT_NEEDED**. Edits happen **in place**, into the slot the linker reserved; a value that does not fit is **refused**, never truncated. Every write is atomic, and the new file is re-parsed and compared with the old one before it replaces it, so an edit that touched anything but its target is refused. `--dry-run` prints the change and writes nothing. It is tested **differentially against patchelf** in CI, and fuzzed. Growing `.dynstr` and `PT_INTERP` is phase 2."

[[params.repos]]
  name = "fwimg"
  pkg = "github.com/go-binfmt/fwimg"
  url = "https://github.com/go-binfmt/fwimg"
  status = "ready"
  blurb = "Converts an ELF executable into the image a bootloader or ROM loads at a fixed address: a **flat binary** (`objcopy -O binary`), a **Motorola S-record**, **Intel HEX**, a **U-Boot uImage** (gzip or lz4 too), a **UF2** file or a **Verilog hex** memory file, with no binutils or `mkimage` on the build host. The input is untrusted, so an image size taken from attacker-controlled addresses, a segment outside the input, an address range that wraps and data past 4 GiB are all **refused**, never truncated. It moved here from `go-coff/peln/fwimg`."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
  accent = "#0079a8"
  accentDark = "#22cce2"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-binfmt.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-binfmt"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64", "386", "s390x"]
